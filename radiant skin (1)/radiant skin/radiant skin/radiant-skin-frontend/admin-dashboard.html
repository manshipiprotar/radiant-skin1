<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Radiant Skin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/admin.css" rel="stylesheet">
<script src="js/main.js"></script>
<script>
  if (!rsIsAdminLoggedIn()) {
    window.location.replace("admin-login.html");
  }
</script>
</head>
<body class="admin-body">

<div class="admin-shell">
  <div id="rs-admin-sidebar"></div>

  <main class="admin-main">
    <div class="admin-topbar">
      <h2>Dashboard</h2>
      <a href="index.html" class="admin-btn-sm"><i class="bi bi-box-arrow-up-right"></i> View Site</a>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <div class="admin-stat-card">
          <div class="label"><i class="bi bi-bag me-1"></i> Total Products</div>
          <div class="value" id="statProducts">0</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="admin-stat-card">
          <div class="label"><i class="bi bi-receipt me-1"></i> Total Orders</div>
          <div class="value" id="statOrders">0</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="admin-stat-card">
          <div class="label"><i class="bi bi-people me-1"></i> Registered Users</div>
          <div class="value" id="statUsers">0</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="admin-stat-card">
          <div class="label"><i class="bi bi-cash-coin me-1"></i> Total Revenue</div>
          <div class="value" id="statRevenue">₹0</div>
        </div>
      </div>
    </div>

    <div class="admin-card">
      <h5 class="mb-3">Recent Orders</h5>
      <table class="admin-table">
        <thead><tr><th>Order ID</th><th>Customer</th><th>Date</th><th>Status</th><th>Total</th></tr></thead>
        <tbody id="recentOrdersBody"></tbody>
      </table>
      <p class="text-muted small mt-3 mb-0" id="noOrdersMsg" style="display:none;">No orders placed yet.</p>
    </div>
  </main>
</div>

<script src="js/products.js"></script>
<script src="js/main.js"></script>
<script src="js/admin.js"></script>
<script>
  rsMountAdmin("dashboard");

  const orders = rsGet("rs_orders", []);
  const users = rsGetUsers();

  document.getElementById('statProducts').textContent = RS_PRODUCTS.length;
  document.getElementById('statOrders').textContent = orders.length;
  document.getElementById('statUsers').textContent = users.length;
  const revenue = orders.reduce((sum, o) => sum + Number(o.total), 0);
  document.getElementById('statRevenue').textContent = rsFormatINR(revenue);

  const recent = orders.slice().reverse().slice(0, 5);
  const badgeClass = { "Processing":"processing", "Shipped":"shipped", "Delivered":"delivered", "Cancelled":"cancelled" };
  document.getElementById('recentOrdersBody').innerHTML = recent.map(o => `
    <tr>
      <td>#RS-${o.id}</td>
      <td>${o.shipping ? o.shipping.name : '—'}</td>
      <td>${o.date}</td>
      <td><span class="admin-badge ${badgeClass[o.status] || 'processing'}">${o.status}</span></td>
      <td>${rsFormatINR(o.total)}</td>
    </tr>`).join('');
  document.getElementById('noOrdersMsg').style.display = orders.length ? 'none' : 'block';
</script>
</body>
</html>
