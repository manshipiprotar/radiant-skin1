<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Orders | Radiant Skin Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/admin.css" rel="stylesheet">
<script src="js/main.js"></script>
<script>
  if (!rsIsAdminLoggedIn()) {
    window.location.replace("admin-login.html");
  }
</script>
</head>
<body class="admin-body">

<div class="admin-shell">
  <div id="rs-admin-sidebar"></div>

  <main class="admin-main">
    <div class="admin-topbar">
      <h2>Manage Orders</h2>
      <span class="text-muted small" id="orderCount">0 orders</span>
    </div>

    <div class="admin-card">
      <div style="overflow-x:auto;">
        <table class="admin-table">
          <thead><tr><th>Order ID</th><th>Customer</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th></tr></thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
      <p class="text-muted small mt-3 mb-0" id="noOrdersMsg" style="display:none;">No orders placed yet.</p>
    </div>
  </main>
</div>

<script src="js/products.js"></script>
<script src="js/main.js"></script>
<script src="js/admin.js"></script>
<script>
  rsMountAdmin("orders");

  function getStatusHtml(order){
    const s = order.status || "Processing";
    
    // 1. Delivered (Final state - Cannot go back or change)
    if(s === "Delivered"){
      return `<span class="admin-badge delivered"><i class="bi bi-check-circle me-1"></i> Delivered</span>`;
    }
    
    // 2. Cancelled (Final state - Cannot be shipped or delivered)
    if(s === "Cancelled"){
      return `<span class="admin-badge cancelled"><i class="bi bi-x-circle me-1"></i> Cancelled</span>`;
    }
    
    // 3. Shipped (Can move forward to Delivered or Cancelled, but cannot go back to Processing)
    if(s === "Shipped"){
      return `
        <select class="form-select form-select-sm" style="width:145px;" onchange="updateStatus(${order.id}, this.value)">
          <option value="Shipped" selected>Shipped</option>
          <option value="Delivered">Deliver ➔</option>
          <option value="Cancelled">Cancel ✖</option>
        </select>
      `;
    }
    
    // 4. Processing (Initial state - Can move forward to Shipped or Cancelled)
    return `
      <select class="form-select form-select-sm" style="width:145px;" onchange="updateStatus(${order.id}, this.value)">
        <option value="Processing" selected>Processing</option>
        <option value="Shipped">Ship ➔</option>
        <option value="Cancelled">Cancel ✖</option>
      </select>
    `;
  }

  function render(){
    const all = rsGet("rs_orders", []).slice().reverse();
    document.getElementById('orderCount').textContent = all.length + ' orders';
    document.getElementById('noOrdersMsg').style.display = all.length ? 'none' : 'block';

    document.getElementById('ordersBody').innerHTML = all.map(o => `
      <tr>
        <td>#RS-${o.id}</td>
        <td>${o.shipping ? o.shipping.name : '—'}<br><span class="text-muted small">${o.shipping ? o.shipping.phone : ''}</span></td>
        <td>${o.date}</td>
        <td>${o.items ? o.items.length : 0} item${(o.items && o.items.length>1)?'s':''}</td>
        <td>${rsFormatINR(o.total)}</td>
        <td>${getStatusHtml(o)}</td>
      </tr>`).join('');
  }

  async function updateStatus(orderId, newStatus){
    if(newStatus === "Cancelled"){
      const ok = confirm("Are you sure you want to Cancel Order #RS-" + orderId + "?\nOnce cancelled, this order cannot be delivered or processed.");
      if(!ok){
        render();
        return;
      }
    }

    const all = rsGet("rs_orders", []);
    const order = all.find(o => o.id === orderId);
    if(order){
      // Validation to enforce one-way progression:
      const current = order.status || "Processing";
      if(current === "Delivered" || current === "Cancelled"){
        rsToast("This order is already " + current + " and cannot be modified.", "danger");
        render();
        return;
      }
      if(current === "Shipped" && newStatus === "Processing"){
        rsToast("Cannot move order back to Processing.", "danger");
        render();
        return;
      }

      order.status = newStatus;
      rsSet("rs_orders", all);
      rsToast("Order #RS-" + orderId + " marked as " + newStatus + " ✓", "success");
      render();

      // Sync with MySQL database
      try {
        await fetch("http://localhost:8080/api/orders", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id: order.id,
            order_number: order.orderNumber || ("ORD-" + order.id),
            status: newStatus
          })
        });
      } catch(err) {
        console.warn("Backend offline for status update:", err);
      }
    }
  }

  async function syncOrdersFromDB() {
    try {
      const res = await fetch("http://localhost:8080/api/orders");
      if (res.ok) {
        const dbOrders = await res.json();
        if (Array.isArray(dbOrders) && dbOrders.length > 0) {
          const localOrders = rsGet("rs_orders", []);
          dbOrders.forEach(dbo => {
            const loc = localOrders.find(l => l.id == dbo.id || l.orderNumber == dbo.number || (l.shipping && l.shipping.phone === dbo.shipping.phone && Math.abs(l.total - dbo.total) < 1));
            if (loc) {
              loc.status = dbo.status;
            } else {
              localOrders.push({
                id: dbo.id,
                orderNumber: dbo.number,
                date: dbo.date ? dbo.date.split(' ')[0] : 'Recent',
                status: dbo.status || 'Processing',
                total: dbo.total,
                items: dbo.items || [],
                shipping: dbo.shipping
              });
            }
          });
          rsSet("rs_orders", localOrders);
          render();
        }
      }
    } catch(e) {
      console.warn("Backend sync offline:", e);
    }
  }

  render();
  syncOrdersFromDB();
</script>
</body>
</html>
