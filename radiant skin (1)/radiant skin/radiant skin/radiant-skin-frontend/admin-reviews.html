<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Reviews | Radiant Skin Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/admin.css" rel="stylesheet">
<script src="js/main.js"></script>
<script>
  if (!rsIsAdminLoggedIn()) {
    window.location.replace("admin-login.html");
  }
</script>
</head>
<body class="admin-body">

<div class="admin-shell">
  <div id="rs-admin-sidebar"></div>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h2>Product Reviews & Ratings</h2>
        <span class="text-muted small" id="reviewCount">Loading reviews...</span>
      </div>
      <div class="d-flex gap-2">
        <select class="form-select form-select-sm w-auto" id="starFilter" onchange="renderReviews()">
          <option value="all">All Ratings</option>
          <option value="5">5 Stars ★★★★★</option>
          <option value="4">4 Stars ★★★★☆</option>
          <option value="3">3 Stars ★★★☆☆</option>
          <option value="2">2 Stars ★★☆☆☆</option>
          <option value="1">1 Star ★☆☆☆☆</option>
        </select>
        <button class="btn btn-sm btn-outline-secondary" onclick="fetchReviews()"><i class="bi bi-arrow-clockwise me-1"></i> Refresh</button>
      </div>
    </div>

    <!-- Stat cards -->
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="admin-stat-card">
          <div class="label"><i class="bi bi-chat-heart me-1"></i> Total Reviews</div>
          <div class="value" id="statTotalRev">0</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="admin-stat-card">
          <div class="label text-warning"><i class="bi bi-star-fill me-1"></i> Average Rating</div>
          <div class="value text-warning" id="statAvgRating">5.0 ★</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="admin-stat-card">
          <div class="label text-success"><i class="bi bi-hand-thumbs-up me-1"></i> 5-Star Reviews</div>
          <div class="value text-success" id="statFiveStarRev">0</div>
        </div>
      </div>
    </div>

    <div class="admin-card">
      <div style="overflow-x:auto;">
        <table class="admin-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Product</th>
              <th>Customer</th>
              <th>Rating</th>
              <th>Review Comment</th>
              <th>Date</th>
              <th>Status</th>
              <th style="width:130px;">Actions</th>
            </tr>
          </thead>
          <tbody id="reviewsBody"></tbody>
        </table>
      </div>
      <p class="text-muted small mt-3 mb-0 text-center py-4" id="noRevAlert" style="display:none;">No product reviews submitted yet.</p>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/products.js"></script>
<script src="js/main.js"></script>
<script src="js/admin.js"></script>
<script>
  rsMountAdmin("reviews");

  let allReviews = [];

  async function fetchReviews(){
    try {
      const res = await fetch("http://localhost:8080/api/reviews");
      if(res.ok){
        allReviews = await res.json();
      } else {
        allReviews = loadLocalReviews();
      }
    } catch(e) {
      allReviews = loadLocalReviews();
    }
    renderReviews();
  }

  function loadLocalReviews(){
    const map = rsGet("rs_reviews", {});
    const list = [];
    Object.keys(map).forEach(pId => {
      const p = rsFindProduct(pId) || { name: pId };
      map[pId].forEach(r => {
        list.push({
          id: r.id || ("r_" + Math.random()),
          productId: pId,
          productName: p.name,
          userName: r.name || "Customer",
          rating: r.rating || 5,
          comment: r.text || r.comment || "",
          status: r.status || "Approved",
          created_at: new Date().toISOString()
        });
      });
    });
    return list;
  }

  function renderReviews(){
    const starFilter = document.getElementById('starFilter').value;
    let list = allReviews.slice();

    // Stats
    const total = allReviews.length;
    let sumRating = 0;
    let fiveStar = 0;
    allReviews.forEach(r => {
      const rate = Number(r.rating) || 5;
      sumRating += rate;
      if(rate === 5) fiveStar++;
    });
    const avg = total > 0 ? (sumRating / total).toFixed(1) : "5.0";

    document.getElementById('statTotalRev').textContent = total;
    document.getElementById('statAvgRating').textContent = avg + " ★";
    document.getElementById('statFiveStarRev').textContent = fiveStar;
    document.getElementById('reviewCount').textContent = total + ' customer reviews';

    if(starFilter !== 'all'){
      list = list.filter(r => Number(r.rating) === Number(starFilter));
    }

    document.getElementById('noRevAlert').style.display = list.length ? 'none' : 'block';

    document.getElementById('reviewsBody').innerHTML = list.map((r, i) => {
      const p = rsFindProduct(r.productId) || { name: r.productName || r.productId, brand: "Radiant Skin", category: "serum" };
      const dateStr = r.created_at ? new Date(r.created_at).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' }) : 'Recent';
      const isApproved = (r.status || 'Approved') === 'Approved';

      return `
      <tr>
        <td>${i+1}</td>
        <td>
          <div class="d-flex align-items-center gap-2">
            <div style="width:36px;height:36px;border-radius:6px;overflow:hidden;background:#f3ece8;flex-shrink:0;">${rsProductImage(p)}</div>
            <div>
              <div class="fw-semibold small">${p.name}</div>
              <div class="text-muted" style="font-size:0.72rem;">#${r.productId}</div>
            </div>
          </div>
        </td>
        <td>
          <div class="fw-semibold small">${r.userName || 'Anonymous'}</div>
          <div class="text-muted" style="font-size:0.72rem;">${r.userEmail || ''}</div>
        </td>
        <td>
          <div class="text-warning small">${rsStars(r.rating)}</div>
        </td>
        <td class="small text-muted" style="max-width:280px;">
          "${r.comment || 'No comment provided'}"
        </td>
        <td class="small text-muted">${dateStr}</td>
        <td>
          <span class="badge ${isApproved ? 'bg-success' : 'bg-warning text-dark'}">${r.status || 'Approved'}</span>
        </td>
        <td>
          <button class="btn btn-sm ${isApproved ? 'btn-outline-warning' : 'btn-outline-success'} me-1" onclick="toggleReviewStatus(${r.id}, '${isApproved ? 'Hidden' : 'Approved'}')" title="${isApproved ? 'Hide Review' : 'Approve Review'}">
            <i class="bi ${isApproved ? 'bi-eye-slash' : 'bi-eye'}"></i>
          </button>
          <button class="btn btn-sm btn-outline-danger" onclick="deleteReview(${r.id}, '${r.productId}')" title="Delete Review">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>`;
    }).join('');
  }

  async function toggleReviewStatus(id, newStatus){
    const r = allReviews.find(x => x.id === id);
    if(r) r.status = newStatus;
    renderReviews();

    try {
      await fetch("http://localhost:8080/api/reviews", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: id, status: newStatus })
      });
      rsToast("Review status marked as " + newStatus + " ✓", "success");
    } catch(e){
      console.warn("Offline review toggle:", e);
    }
  }

  async function deleteReview(id, productId){
    if(!confirm("Are you sure you want to permanently delete this review?")) return;
    allReviews = allReviews.filter(r => r.id !== id);
    renderReviews();

    try {
      await fetch(`http://localhost:8080/api/reviews?id=${id}`, { method: "DELETE" });
      rsToast("Review deleted ✓", "info");
    } catch(e){
      console.warn("Offline delete:", e);
    }
  }

  fetchReviews();
</script>
</body>
</html>
