<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart | Radiant Skin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="rs-navbar"></div>

<section class="container pt-4">
  <div class="rs-breadcrumb"><a href="index.html">Home</a> / <span class="current">Shopping Bag</span></div>
  <h1 class="display-6 mb-4">Shopping Bag</h1>

  <div class="row g-4">
    <div class="col-lg-8" id="rsCartItems"></div>

    <div class="col-lg-4">
      <div class="rs-card p-4">
        <h5 class="mb-3">Order Summary</h5>
        <div class="d-flex justify-content-between small mb-2"><span class="text-muted">Subtotal</span><span id="rsSubtotal">₹0</span></div>
        <div class="d-flex justify-content-between small mb-2"><span class="text-muted">Shipping</span><span id="rsShipping">₹0</span></div>
        <hr>
        <div class="d-flex justify-content-between fw-semibold mb-4"><span>Total</span><span id="rsTotal">₹0</span></div>
        <a href="checkout.html" class="btn-radiant btn w-100" id="rsCheckoutBtn">Proceed to Checkout</a>
        <p class="text-muted small text-center mt-3 mb-0"><i class="bi bi-truck me-1"></i>Cash on Delivery available</p>
      </div>
    </div>
  </div>

  <div id="rsEmptyCart" class="text-center py-5" style="display:none;">
    <i class="bi bi-bag-x fs-1 text-muted"></i>
    <p class="text-muted mt-2">Your bag is empty.</p>
    <a href="shop.html" class="btn-radiant btn">Continue Shopping</a>
  </div>
</section>

<div id="rs-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/products.js"></script>
<script src="js/main.js"></script>
<script src="js/partials.js"></script>
<script>
  rsMountPartials("");

  function renderCart(){
    const cart = rsGetCart();
    const wrap = document.getElementById('rsCartItems');
    const summaryCol = document.querySelector('.col-lg-4');

    if(!cart.length){
      wrap.innerHTML = '';
      summaryCol.style.display = 'none';
      document.getElementById('rsEmptyCart').style.display = 'block';
      return;
    }
    document.getElementById('rsEmptyCart').style.display = 'none';
    summaryCol.style.display = 'block';

    wrap.innerHTML = cart.map(item => {
      const p = rsFindProduct(item.id);
      if(!p) return '';
      return `
      <div class="rs-card p-3 mb-3 d-flex align-items-center gap-3">
        <div style="width:80px;height:80px; background:${RS_CATEGORIES[p.category].color}; border-radius:12px; flex-shrink:0; overflow:hidden;">${rsProductImage(p)}</div>
        <div class="flex-grow-1">
          <div class="p-brand">${p.brand}</div>
          <div class="fw-medium">${p.name}</div>
          <div class="text-muted small">${rsFormatINR(p.price)} each</div>
        </div>
        <div class="qty-box">
          <button onclick="rsChangeCartQty('${p.id}',-1)">−</button>
          <input type="text" value="${item.qty}" readonly>
          <button onclick="rsChangeCartQty('${p.id}',1)">+</button>
        </div>
        <div class="fw-semibold" style="min-width:70px; text-align:right;">${rsFormatINR(p.price*item.qty)}</div>
        <button class="btn btn-link text-danger" onclick="rsRemoveFromCart('${p.id}'); renderCart();"><i class="bi bi-trash"></i></button>
      </div>`;
    }).join('');

    const subtotal = rsCartTotal();
    const shipping = subtotal >= 999 || subtotal === 0 ? 0 : 49;
    document.getElementById('rsSubtotal').textContent = rsFormatINR(subtotal);
    document.getElementById('rsShipping').textContent = shipping === 0 ? 'Free' : rsFormatINR(shipping);
    document.getElementById('rsTotal').textContent = rsFormatINR(subtotal + shipping);
  }

  function rsChangeCartQty(id, delta){
    const cart = rsGetCart();
    const item = cart.find(i => String(i.id) === String(id));
    if(!item) return;
    const newQty = item.qty + delta;
    if(newQty <= 0){
      rsRemoveFromCart(id);
    } else {
      rsUpdateCartQty(id, newQty);
    }
    renderCart();
  }

  document.getElementById('rsCheckoutBtn').addEventListener('click', function(e){
    if(!rsIsLoggedIn()){
      e.preventDefault();
      sessionStorage.setItem("rs_redirect", "checkout.html");
      rsToast("Please login to proceed to checkout.", "info");
      setTimeout(()=> window.location.href = "login.html", 800);
    }
  });

  renderCart();
</script>
</body>
</html>
