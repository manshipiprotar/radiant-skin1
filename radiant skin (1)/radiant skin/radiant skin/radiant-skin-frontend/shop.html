<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop All Products | Radiant Skin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="rs-navbar"></div>

<section class="container pt-4">
  <div class="rs-breadcrumb"><a href="index.html">Home</a> / <span class="current">Shop All Products</span></div>
  <h1 class="display-6 mb-4">Curated Radiance</h1>

  <div class="row g-4">
    <!-- Sidebar Filters -->
    <div class="col-lg-3">
      <div class="rs-card p-4 mb-3">
        <h6 class="mb-3">Search</h6>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0" style="border-radius:10px 0 0 10px;"><i class="bi bi-search"></i></span>
          <input type="text" id="rsSearchInput" class="form-control border-start-0" style="border-radius:0 10px 10px 0;" placeholder="Search our rituals...">
        </div>
      </div>

      <div class="rs-card p-4 mb-3">
        <h6 class="mb-3">Categories</h6>
        <div id="rsCategoryFilters" class="d-flex flex-column gap-2"></div>
      </div>

      <div class="rs-card p-4 mb-3">
        <h6 class="mb-3">Price Range</h6>
        <input type="range" class="form-range" min="0" max="500" step="10" id="rsPriceRange" value="500">
        <div class="d-flex justify-content-between small text-muted">
          <span>₹0</span>
          <span id="rsPriceLabel">Up to ₹500</span>
        </div>
      </div>

      <div class="rs-card p-4" style="background:var(--blush);">
        <p class="small mb-2">"Your beauty ritual starts with a moment of self care."</p>
        <i class="bi bi-quote fs-4" style="color:var(--primary);"></i>
      </div>
    </div>

    <!-- Product Grid -->
    <div class="col-lg-9">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <span class="text-muted small" id="rsResultCount">60 products</span>
        <select class="form-select w-auto" id="rsSortSelect">
          <option value="featured">Sort by: Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="rating">Highest Rated</option>
          <option value="name">Name: A-Z</option>
        </select>
      </div>
      <div class="row g-4" id="rsProductGrid"></div>
      <div id="rsNoResults" class="text-center py-5" style="display:none;">
        <i class="bi bi-emoji-frown fs-1 text-muted"></i>
        <p class="text-muted mt-2">No products match your search. Try a different keyword or filter.</p>
      </div>
    </div>
  </div>
</section>

<section class="rs-section-sm mt-4">
  <div class="container">
    <div class="newsletter-band text-center">
      <span class="eyebrow">Join the Circle</span>
      <h2 class="section-title mt-2">Exclusive skin rituals and sustainable beauty tips</h2>
      <form class="row justify-content-center g-2 mt-3" style="max-width:480px; margin:0 auto;" onsubmit="rsToast('Thanks for subscribing!','success'); return false;">
        <div class="col-8"><input type="email" class="form-control" placeholder="Email address" required></div>
        <div class="col-4"><button class="btn-radiant btn w-100" type="submit">Subscribe</button></div>
      </form>
    </div>
  </div>
</section>

<div id="rs-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/products.js"></script>
<script src="js/main.js"></script>
<script src="js/partials.js"></script>
<script>
  rsMountPartials("shop");

  function rsProductCard(p){
    const rInfo = rsGetProductRatingInfo(p.id);
    return `
    <div class="col-lg-4 col-md-6 col-sm-6">
      <div class="product-card">
        ${p.discount ? `<span class="discount-badge">-${p.discount}%</span>` : ''}
        <button class="wishlist-toggle ${rsIsWishlisted(p.id)?'active':''}" onclick="event.preventDefault(); this.classList.toggle('active', rsToggleWishlist('${p.id}'));">
          <i class="bi bi-heart${rsIsWishlisted(p.id)?'-fill':''}"></i>
        </button>
        <a href="product-details.html?id=${p.id}" class="text-decoration-none text-reset">
          <div class="product-img-wrap">${rsProductImage(p)}</div>
          <div class="p-body">
            <div class="p-brand">${p.brand}</div>
            <div class="p-name">${p.name}</div>
            <div class="p-rating mb-2">${rsStars(rInfo.rating)} <span class="text-muted ms-1">${rInfo.rating} (${rInfo.count})</span></div>
            <div class="p-price">${rsFormatINR(p.price)}${p.oldPrice ? `<span class="old">${rsFormatINR(p.oldPrice)}</span>` : ''}</div>
          </div>
        </a>
        <div class="px-3 pb-3">
          <button class="btn-radiant btn btn-sm w-100" onclick="rsAddToCartGated('${p.id}',1)"><i class="bi bi-bag-plus me-1"></i> Add to Cart</button>
        </div>
      </div>
    </div>`;
  }

  // ---- State from URL ----
  const urlParams = new URLSearchParams(window.location.search);
  let state = {
    cat: urlParams.get('cat') || 'all',
    search: '',
    maxPrice: 500,
    sort: 'featured'
  };

  // ---- Category filter pills ----
  function renderCategoryFilters(){
    let html = `<div class="cat-pill ${state.cat==='all'?'active':''}" data-cat="all">All Products</div>`;
    Object.keys(RS_CATEGORIES).forEach(key => {
      html += `<div class="cat-pill ${state.cat===key?'active':''}" data-cat="${key}">${RS_CATEGORIES[key].label}</div>`;
    });
    document.getElementById('rsCategoryFilters').innerHTML = html;
    document.querySelectorAll('#rsCategoryFilters .cat-pill').forEach(el => {
      el.addEventListener('click', () => { state.cat = el.dataset.cat; renderGrid(); renderCategoryFilters(); });
    });
  }

  function renderGrid(){
    let list = rsProductsByCategory(state.cat);
    if(state.search.trim()){
      const q = state.search.toLowerCase();
      list = list.filter(p => p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q) || p.categoryLabel.toLowerCase().includes(q));
    }
    list = list.filter(p => p.price <= state.maxPrice);
    switch(state.sort){
      case 'price-asc': list = [...list].sort((a,b)=>a.price-b.price); break;
      case 'price-desc': list = [...list].sort((a,b)=>b.price-a.price); break;
      case 'rating': list = [...list].sort((a,b)=>b.rating-a.rating); break;
      case 'name': list = [...list].sort((a,b)=>a.name.localeCompare(b.name)); break;
    }
    document.getElementById('rsResultCount').textContent = list.length + ' products';
    document.getElementById('rsProductGrid').innerHTML = list.map(rsProductCard).join('');
    document.getElementById('rsNoResults').style.display = list.length ? 'none' : 'block';
  }

  document.getElementById('rsSearchInput').addEventListener('input', e => { state.search = e.target.value; renderGrid(); });
  document.getElementById('rsSortSelect').addEventListener('change', e => { state.sort = e.target.value; renderGrid(); });
  document.getElementById('rsPriceRange').addEventListener('input', e => {
    state.maxPrice = Number(e.target.value);
    document.getElementById('rsPriceLabel').textContent = state.maxPrice >= 500 ? 'Up to ₹500' : '₹0 - ' + rsFormatINR(state.maxPrice);
    renderGrid();
  });

  window.renderCategoryFilters = renderCategoryFilters;
  window.renderGrid = renderGrid;

  renderCategoryFilters();
  renderGrid();
</script>
</body>
</html>
