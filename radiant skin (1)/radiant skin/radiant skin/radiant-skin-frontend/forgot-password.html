<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Radiant Skin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="rs-navbar"></div>

<section class="container auth-wrap">
  <div class="row g-4 align-items-center w-100">
    <div class="col-lg-6 d-none d-lg-block">
      <div class="auth-visual" id="authVisual" style="position:relative; overflow:hidden; background-image:url('images/P071.jpg'); background-size:cover; background-position:center;">
        <div style="position:absolute; inset:0; background:linear-gradient(180deg, rgba(30,20,22,.15) 0%, rgba(30,20,22,.55) 100%); z-index:1;"></div>
        <div style="position:relative; z-index:2;">
          <h2 class="display-6" style="max-width:380px; color:#fff;">A little reset, before your <span class="italic-accent" style="color:#F3D9DC;">glow-up</span>.</h2>
          <p style="color:rgba(255,255,255,.88);">Enter your email and we'll help you get back into your account.</p>
        </div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="auth-card mx-auto" style="max-width:440px;">
        <span class="eyebrow">Account Recovery</span>
        <h2 class="mt-2 mb-2">Forgot your password?</h2>
        <p class="text-muted small mb-4">Enter the email linked to your account and we'll send you a reset link.</p>
        <form id="rsForgotForm" novalidate>
          <div class="mb-4">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" id="fEmail" required>
          </div>
          <button type="submit" class="btn-radiant btn w-100">Send Reset Link</button>
        </form>
        <div id="rsForgotSuccess" class="alert border-0 mt-3" style="background:#E4EFE7; color:#4A7A5C; display:none;">
          <i class="bi bi-check-circle me-1"></i> If an account exists for that email, a reset link has been sent.
        </div>
        <p class="text-center small text-muted mt-4"><a href="login.html" style="color:var(--primary);"><i class="bi bi-arrow-left me-1"></i>Back to Login</a></p>
      </div>
    </div>
  </div>
</section>

<div id="rs-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/products.js"></script>
<script src="js/main.js"></script>
<script src="js/partials.js"></script>
<script>
  rsMountPartials("");
  document.getElementById('rsForgotForm').addEventListener('submit', function(e){
    e.preventDefault();
    document.getElementById('rsForgotSuccess').style.display = 'block';
    this.querySelector('button').disabled = true;
  });
</script>
</body>
</html>
