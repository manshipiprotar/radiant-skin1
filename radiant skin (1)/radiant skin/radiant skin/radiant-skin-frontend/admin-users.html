<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Users | Radiant Skin Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/admin.css" rel="stylesheet">
<script src="js/main.js"></script>
<script>
  if (!rsIsAdminLoggedIn()) {
    window.location.replace("admin-login.html");
  }
</script>
</head>
<body class="admin-body">

<div class="admin-shell">
  <div id="rs-admin-sidebar"></div>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h2>Manage Users</h2>
        <span class="text-muted small" id="userCount">Loading users...</span>
      </div>
      <button class="btn btn-sm btn-outline-secondary" onclick="fetchUsers()"><i class="bi bi-arrow-clockwise me-1"></i> Refresh Users</button>
    </div>

    <div class="admin-card">
      <div style="overflow-x:auto;">
        <table class="admin-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone / City</th>
              <th>Role</th>
              <th>Registered On</th>
              <th style="width:130px;">Actions</th>
            </tr>
          </thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
      <p class="text-muted small mt-3 mb-0 text-center py-4" id="noUsersMsg" style="display:none;">No registered customer users found in MySQL Database.</p>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/products.js"></script>
<script src="js/main.js"></script>
<script src="js/admin.js"></script>
<script>
  rsMountAdmin("users");

  let dbUsers = [];

  async function fetchUsers(){
    try {
      const res = await fetch("http://localhost:8080/api/users");
      if (res.ok) {
        dbUsers = await res.json();
      } else {
        dbUsers = rsGetUsers();
      }
    } catch(e) {
      dbUsers = rsGetUsers();
    }
    renderUsers();
  }

  function renderUsers(){
    // Filter out pure admin if needed or show with badge
    const list = dbUsers.filter(u => u.role !== 'admin' || dbUsers.length === 1);

    document.getElementById('userCount').textContent = list.length + ' registered users';
    document.getElementById('noUsersMsg').style.display = list.length ? 'none' : 'block';

    document.getElementById('usersBody').innerHTML = list.map((u, i) => {
      const dateStr = u.created_at ? new Date(u.created_at).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' }) : '—';
      const isSelfAdmin = (u.email && u.email.toLowerCase().includes('admin'));

      return `
      <tr>
        <td>${i + 1}</td>
        <td>
          <div class="fw-semibold">${u.name}</div>
        </td>
        <td>${u.email}</td>
        <td>
          <div>${u.phone || '—'}</div>
          <span class="text-muted small">${u.city || ''}</span>
        </td>
        <td>
          <span class="badge ${u.role === 'admin' ? 'bg-primary' : 'bg-success'} text-white" style="font-size:0.75rem;">
            ${u.role || 'customer'}
          </span>
        </td>
        <td><span class="text-muted small">${dateStr}</span></td>
        <td>
          ${isSelfAdmin ? '<span class="text-muted small">Admin Account</span>' : `
            <button class="admin-btn-sm danger" onclick="deleteUserConfirm('${u.email}', '${u.name}')" title="Delete User from Database">
              <i class="bi bi-trash me-1"></i> Remove
            </button>
          `}
        </td>
      </tr>`;
    }).join('');
  }

  async function deleteUserConfirm(email, name){
    if(confirm(`Are you sure you want to permanently delete user '${name}' (${email}) from MySQL database?`)){
      try {
        const res = await fetch("http://localhost:8080/api/users?email=" + encodeURIComponent(email), {
          method: "DELETE"
        });
        const data = await res.json();
        if(data && data.success){
          rsToast("User removed from MySQL Database ✓", "success");
        } else {
          rsToast("User deleted.", "info");
        }
      } catch(e){
        rsToast("User deleted from local list.", "info");
      }

      // Also clean from local storage
      let localUsers = rsGetUsers().filter(u => u.email.toLowerCase() !== email.toLowerCase());
      rsSet("rs_users", localUsers);

      fetchUsers();
    }
  }

  fetchUsers();
</script>
</body>
</html>
