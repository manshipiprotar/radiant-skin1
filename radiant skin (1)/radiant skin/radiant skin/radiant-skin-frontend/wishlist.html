<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wishlist | Radiant Skin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="rs-navbar"></div>

<section class="container pt-4">
  <div class="rs-breadcrumb"><a href="index.html">Home</a> / <span class="current">Wishlist</span></div>
  <h1 class="display-6 mb-4">My Wishlist</h1>
  <div class="row g-4" id="rsWishlistGrid"></div>
  <div id="rsEmptyWishlist" class="text-center py-5" style="display:none;">
    <i class="bi bi-heart fs-1 text-muted"></i>
    <p class="text-muted mt-2">Your wishlist is empty. Save the rituals you love for later.</p>
    <a href="shop.html" class="btn-radiant btn">Browse Products</a>
  </div>
</section>

<div id="rs-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/products.js"></script>
<script src="js/main.js"></script>
<script src="js/partials.js"></script>
<script>
  rsMountPartials("");

  function renderWishlist(){
    const ids = rsGetWishlist();
    const list = ids.map(id => rsFindProduct(id)).filter(Boolean);
    document.getElementById('rsEmptyWishlist').style.display = list.length ? 'none' : 'block';
    document.getElementById('rsWishlistGrid').innerHTML = list.map(p => `
      <div class="col-lg-3 col-md-4 col-6">
        <div class="product-card">
          <button class="wishlist-toggle active" onclick="rsToggleWishlist('${p.id}'); renderWishlist();">
            <i class="bi bi-heart-fill"></i>
          </button>
          <a href="product-details.html?id=${p.id}" class="text-decoration-none text-reset">
            <div class="product-img-wrap">${rsProductImage(p)}</div>
            <div class="p-body">
              <div class="p-brand">${p.brand}</div>
              <div class="p-name">${p.name}</div>
              <div class="p-price">${rsFormatINR(p.price)}</div>
            </div>
          </a>
          <div class="px-3 pb-3">
            <button class="btn-radiant btn btn-sm w-100" onclick="rsAddToCartGated('${p.id}',1)">Add to Cart</button>
          </div>
        </div>
      </div>`).join('');
  }
  renderWishlist();
</script>
</body>
</html>
