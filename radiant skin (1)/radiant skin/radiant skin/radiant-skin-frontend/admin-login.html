<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Radiant Skin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body style="background:var(--cream-soft,#F7F1E7); min-height:100vh; display:flex; align-items:center;">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="rs-card p-5">
        <div class="text-center mb-4">
          <i class="bi bi-shield-lock fs-1" style="color:var(--primary);"></i>
          <h3 class="mt-2">Admin Login</h3>
          <p class="text-muted small">Radiant Skin — Store Management</p>
        </div>
        <form id="rsAdminLoginForm" novalidate>
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" id="aEmail" required>
          </div>
          <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="aPassword" required>
          </div>
          <button type="submit" class="btn-radiant btn w-100">Login to Dashboard</button>
        </form>
        <p class="text-center small text-muted mt-4 mb-0"><br>
        <p class="text-center small mt-3"><a href="index.html" style="color:var(--primary);"><i class="bi bi-arrow-left"></i> Back to site</a></p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/products.js"></script>
<script src="js/main.js"></script>
<script>
  document.getElementById('rsAdminLoginForm').addEventListener('submit', function(e){
    e.preventDefault();
    const email = document.getElementById('aEmail').value.trim();
    const password = document.getElementById('aPassword').value;
    if(rsAdminLogin(email, password)){
      window.location.href = "admin-dashboard.html";
    } else {
      rsToast("Invalid admin credentials.", "danger");
    }
  });
</script>
</body>
</html>
